<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set up your account · callstack</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1E3FBF', hover: '#1A37A8', ring: '#1E3FBF' },
            cream:   { DEFAULT: '#F3EBDA', deep: '#E9DFC9' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>

<body class="min-h-screen bg-white font-sans text-neutral-900 antialiased">
  <main>
    <section class="flex min-h-screen items-center justify-center px-6 py-16 sm:px-12">
      <div class="w-full max-w-sm">

        <!-- Header row -->
        <div class="flex items-center justify-between">
          <a href="/" class="text-base font-semibold tracking-tight">callstack</a>
          <span id="step-indicator" class="text-xs font-medium text-neutral-400">Step 1 of 2</span>
        </div>

        <!-- Progress -->
        <div class="mt-6 grid grid-cols-2 gap-2" aria-hidden="true">
          <div data-bar="1" class="h-1 rounded-full bg-primary"></div>
          <div data-bar="2" class="h-1 rounded-full bg-neutral-200"></div>
        </div>

        <!-- ───────── Step 1: profile ───────── -->
        <form id="step-profile" data-step="1" class="mt-14" novalidate>
          <h1 class="text-3xl font-semibold leading-tight tracking-tight">Tell us who you are.</h1>
          <p class="mt-4 text-sm leading-relaxed text-neutral-500">
            Pick a username and, optionally, an avatar. You can change both later.
          </p>

          <div class="mt-10 space-y-5">
            <div>
              <label for="username" class="block text-sm font-medium text-neutral-800">Username</label>
              <input id="username" name="username" type="text" autocomplete="username" required
                     minlength="3" maxlength="64" pattern="[a-zA-Z0-9_.-]+"
                     class="mt-2 block w-full rounded-lg border border-neutral-200 bg-white px-3.5 py-2.5 text-sm placeholder:text-neutral-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
                     placeholder="yourname" />
              <p class="mt-2 text-xs text-neutral-400">Letters, numbers, dots, dashes and underscores.</p>
            </div>

            <div>
              <label for="avatar_url" class="block text-sm font-medium text-neutral-800">
                Avatar URL <span class="font-normal text-neutral-400">(optional)</span>
              </label>
              <div class="mwt-2 flex items-center gap-3">
                <div id="avatar-preview"
                     class="h-10 w-10 shrink-0 overflow-hidden rounded-full border border-neutral-200 bg-cream"></div>
                <input id="avatar_url" name="avatar_url" type="url" autocomplete="url"
                       class="block w-full rounded-lg border border-neutral-200 bg-white px-3.5 py-2.5 text-sm placeholder:text-neutral-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
                       placeholder="https://…/avatar.png" />
              </div>
            </div>

            <p class="error hidden text-sm text-red-600" role="alert"></p>

            <button type="submit"
                    class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-ring focus-visible:ring-offset-2 disabled:opacity-60">
              Continue
            </button>
          </div>
        </form>

        <!-- ───────── Step 2: preferences ───────── -->
        <form id="step-preferences" data-step="2" class="mt-14 hidden" novalidate>
          <h1 class="text-3xl font-semibold leading-tight tracking-tight">Make it yours.</h1>
          <p class="mt-4 text-sm leading-relaxed text-neutral-500">
            Set a few defaults. These live in your profile preferences.
          </p>

          <div class="mt-10 space-y-8">
            <!-- Theme -->
            <fieldset>
              <legend class="text-sm font-medium text-neutral-800">Appearance</legend>
              <div class="mt-3 grid grid-cols-2 gap-3">
                <label class="cursor-pointer">
                  <input type="radio" name="theme" value="light" class="peer sr-only" checked />
                  <div class="rounded-lg border border-neutral-200 p-4 transition peer-checked:border-primary peer-checked:ring-2 peer-checked:ring-primary/20 peer-focus-visible:ring-2 peer-focus-visible:ring-primary-ring">
                    <div class="h-12 rounded-md border border-neutral-200 bg-white">
                      <div class="m-2 h-1.5 w-1/2 rounded bg-neutral-200"></div>
                      <div class="mx-2 h-1.5 w-1/3 rounded bg-neutral-200"></div>
                    </div>
                    <p class="mt-3 text-sm font-medium">Light</p>
                  </div>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" name="theme" value="dark" class="peer sr-only" />
                  <div class="rounded-lg border border-neutral-200 p-4 transition peer-checked:border-primary peer-checked:ring-2 peer-checked:ring-primary/20 peer-focus-visible:ring-2 peer-focus-visible:ring-primary-ring">
                    <div class="h-12 rounded-md bg-neutral-900">
                      <div class="m-2 h-1.5 w-1/2 rounded bg-neutral-700"></div>
                      <div class="mx-2 h-1.5 w-1/3 rounded bg-neutral-700"></div>
                    </div>
                    <p class="mt-3 text-sm font-medium">Dark</p>
                  </div>
                </label>
              </div>
            </fieldset>

            <!-- Push notifications -->
            <label for="push_notifications" class="flex cursor-pointer items-start justify-between gap-6">
              <span>
                <span class="block text-sm font-medium text-neutral-800">Push notifications</span>
                <span class="mt-1 block text-sm text-neutral-500">Get notified when a run finishes or a test case fails.</span>
              </span>
              <span class="relative mt-0.5 shrink-0">
                <input id="push_notifications" name="push_notifications" type="checkbox" class="peer sr-only" checked />
                <span class="block h-6 w-11 rounded-full bg-neutral-200 transition peer-checked:bg-primary peer-focus-visible:ring-2 peer-focus-visible:ring-primary-ring peer-focus-visible:ring-offset-2"></span>
                <span class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition peer-checked:translate-x-5"></span>
              </span>
            </label>

            <p class="error hidden text-sm text-red-600" role="alert"></p>

            <div class="flex items-center gap-3">
              <button type="button" id="back"
                      class="rounded-lg border border-neutral-200 px-4 py-2.5 text-sm font-medium text-neutral-700 transition hover:bg-neutral-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-ring focus-visible:ring-offset-2">
                Back
              </button>
              <button type="submit"
                      class="flex-1 rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-ring focus-visible:ring-offset-2 disabled:opacity-60">
                Finish
              </button>
            </div>
          </div>
        </form>

      </div>
    </section>
  </main>

  <script>
    const store = (() => { try { return localStorage; } catch { return null; } })();
    const token = store?.getItem('access_token');
    if (!token) window.location.replace('/login');

    const API = '';                    // same origin; set to e.g. 'http://localhost:8000' if served separately
    const DONE_URL = '/home';           // where to go after onboarding

    const forms = {
      1: document.getElementById('step-profile'),
      2: document.getElementById('step-preferences'),
    };
    const indicator = document.getElementById('step-indicator');

    async function api(path, { method = 'GET', body } = {}) {
      const res = await fetch(API + path, {
        method,
        headers: {
          'Authorization': `Bearer ${token}`,
          ...(body ? { 'Content-Type': 'application/json' } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 401) {
        store?.removeItem('access_token');
        window.location.replace('/login');
        return;
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(typeof data.detail === 'string' ? data.detail : 'Something went wrong.');
        err.status = res.status;
        throw err;
      }
      return data;
    }

    function showStep(n) {
      Object.entries(forms).forEach(([k, f]) => f.classList.toggle('hidden', Number(k) !== n));
      document.querySelectorAll('[data-bar]').forEach((bar) => {
        const active = Number(bar.dataset.bar) <= n;
        bar.classList.toggle('bg-primary', active);
        bar.classList.toggle('bg-neutral-200', !active);
      });
      indicator.textContent = `Step ${n} of 2`;
      forms[n].querySelector('input, [tabindex]')?.focus();
    }

    function setError(form, message) {
      const el = form.querySelector('.error');
      el.textContent = message || '';
      el.classList.toggle('hidden', !message);
    }

    async function withSubmitting(form, fn) {
      const button = form.querySelector('button[type="submit"]');
      setError(form, '');
      button.disabled = true;
      try { await fn(); }
      catch (err) { setError(form, err.message); }
      finally { button.disabled = false; }
    }

    // Avatar preview
    const avatarInput = document.getElementById('avatar_url');
    const avatarPreview = document.getElementById('avatar-preview');
    avatarInput.addEventListener('input', () => {
      const url = avatarInput.value.trim();
      avatarPreview.innerHTML = url
        ? `<img src="${url.replace(/"/g, '&quot;')}" alt="" class="h-full w-full object-cover" onerror="this.remove()" />`
        : '';
    });

    // Step 1 → POST /profiles/
    forms[1].addEventListener('submit', (e) => {
      e.preventDefault();
      if (!forms[1].reportValidity()) return;
      withSubmitting(forms[1], async () => {
        const fd = new FormData(forms[1]);
        const body = { username: fd.get('username').trim() };
        const avatar = fd.get('avatar_url').trim();
        if (avatar) body.avatar_url = avatar;

        try {
          await api('/profiles/', { method: 'POST', body });
        } catch (err) {
          // Profile already exists (e.g. double submit) → don't block, just move on
          if (err.status !== 409) throw err;
        }
        showStep(2);
      });
    });

    // Step 2 → PATCH /profiles/ with preferences
    forms[2].addEventListener('submit', (e) => {
      e.preventDefault();
      withSubmitting(forms[2], async () => {
        const fd = new FormData(forms[2]);
        const preferences = {
          theme: fd.get('theme'),
          push_notifications: fd.get('push_notifications') === 'on',
        };
        await api('/profiles/', { method: 'PATCH', body: { preferences } });
        store?.setItem('theme', preferences.theme);
        window.location.replace(DONE_URL);
      });
    });

    document.getElementById('back').addEventListener('click', () => showStep(1));

    // Users who already have a profile don't need onboarding
    (async () => {
      try {
        const profile = await api('/profiles/');
        if (profile) window.location.replace(DONE_URL);
      } catch (err) {
        if (err.status !== 404) setError(forms[1], err.message);
      }
    })();
  </script>
</body>
</html>
