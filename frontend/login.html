<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · callstack</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Palette sampled from the hero image: ultramarine sky + cream ground
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1E3FBF', hover: '#1A37A8', ring: '#1E3FBF' },
            cream:   { DEFAULT: '#F3EBDA', deep: '#E9DFC9' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>

<body class="min-h-screen bg-white font-sans text-neutral-900 antialiased">
  <main class="grid min-h-screen lg:grid-cols-2">

    <!-- Left: hero image -->
    <aside class="relative hidden overflow-hidden bg-primary lg:block">
      <img src="/assets/hero.jpg" alt=""
           class="absolute inset-0 h-full w-full object-cover" />
      <figcaption class="absolute inset-x-0 bottom-0 p-12">
        <p class="max-w-sm text-sm leading-relaxed text-cream/90">
          Every call, every frame, in one place. Trace what happened and why — without the noise.
        </p>
      </figcaption>
    </aside>

    <!-- Right: form -->
    <section class="flex items-center justify-center px-6 py-16 sm:px-12">
      <div class="w-full max-w-sm">

        <!-- Header row -->
        <div class="flex items-center justify-between">
          <a href="/" class="text-base font-semibold tracking-tight">callstack</a>
          <a href="/get-started"
             class="rounded-full border border-neutral-200 px-4 py-1.5 text-xs font-medium text-neutral-700 transition hover:bg-neutral-50">
            Create account
          </a>
        </div>

        <!-- Copy -->
        <div class="mt-16">
          <h1 class="text-3xl font-semibold leading-tight tracking-tight">
            Welcome back.<br />Sign in to continue.
          </h1>
          <p class="mt-4 text-sm leading-relaxed text-neutral-500">
            Pick up where you left off — your projects, test cases, and recent runs are waiting.
          </p>
        </div>

        <!-- Social login -->
        <div class="mt-10 grid grid-cols-2 gap-3">
          <a href="/auth/google-login"
             class="flex items-center justify-center gap-2.5 rounded-lg border border-neutral-200 bg-white px-4 py-2.5 text-sm font-medium text-neutral-800 transition hover:bg-neutral-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-ring focus-visible:ring-offset-2">
            <svg class="h-4 w-4" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/>
              <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.7-4.9H1.3v3.1C3.3 21.4 7.3 24 12 24z"/>
              <path fill="#FBBC05" d="M5.3 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4V6.5H1.3C.5 8.1 0 10 0 12s.5 3.9 1.3 5.5l4-3.1z"/>
              <path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.3 2.6 1.3 6.5l4 3.1c1-2.8 3.6-4.8 6.7-4.8z"/>
            </svg>
            Google
          </a>

          <a href="#"
             class="flex items-center justify-center gap-2.5 rounded-lg border border-neutral-200 bg-white px-4 py-2.5 text-sm font-medium text-neutral-800 transition hover:bg-neutral-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-ring focus-visible:ring-offset-2">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3z"/>
            </svg>
            GitHub
          </a>
        </div>

        <!-- Divider -->
        <div class="my-8 flex items-center gap-4">
          <div class="h-px flex-1 bg-neutral-200"></div>
          <span class="text-xs uppercase tracking-wide text-neutral-400">or</span>
          <div class="h-px flex-1 bg-neutral-200"></div>
        </div>

        <!-- Email / password -->
        <form id="login-form" class="space-y-5" novalidate>
          <div>
            <label for="email" class="block text-sm font-medium text-neutral-800">Email address</label>
            <input id="email" name="username" type="email" autocomplete="email" required
                   class="mt-2 block w-full rounded-lg border border-neutral-200 bg-white px-3.5 py-2.5 text-sm placeholder:text-neutral-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
                   placeholder="name@company.com" />
          </div>

          <div>
            <div class="flex items-center justify-between">
              <label for="password" class="block text-sm font-medium text-neutral-800">Password</label>
              <a href="/forgot-password" class="text-sm font-medium text-primary hover:text-primary-hover">Forgot password?</a>
            </div>
            <input id="password" name="password" type="password" autocomplete="current-password" required
                   class="mt-2 block w-full rounded-lg border border-neutral-200 bg-white px-3.5 py-2.5 text-sm placeholder:text-neutral-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20"
                   placeholder="••••••••" />
          </div>

          <p id="error" class="hidden text-sm text-red-600" role="alert"></p>

          <button type="submit"
                  class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-primary-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-ring focus-visible:ring-offset-2 disabled:opacity-60">
            Sign in
          </button>
        </form>

        <!-- Footer -->
        <p class="mt-10 border-t border-neutral-200 pt-6 text-xs leading-relaxed text-neutral-500">
          By signing in, you agree to callstack's
          <a href="/terms" class="underline underline-offset-2 hover:text-neutral-800">Terms</a> and
          <a href="/privacy" class="underline underline-offset-2 hover:text-neutral-800">Privacy Policy</a>.
        </p>
      </div>
    </section>
  </main>

  <script>
    // POST /auth/login expects OAuth2 form fields: username + password
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(new FormData(form)),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || 'Invalid email or password.');
        }
        const { access_token, refresh_token } = await res.json();
        try {
          localStorage.setItem('access_token', access_token);
          localStorage.setItem('refresh_token', refresh_token);
        } catch {}
        // Users who already have a profile skip onboarding
        const profile = await fetch('/profiles/', { headers: { 'Authorization': `Bearer ${access_token}` } });
        window.location.href = profile.ok ? '/home' : '/onboarding';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
