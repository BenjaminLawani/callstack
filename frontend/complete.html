<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signing you in · callstack</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#1E3FBF', hover: '#1A37A8', ring: '#1E3FBF' },
            cream:   { DEFAULT: '#F3EBDA', deep: '#E9DFC9' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>

<body class="min-h-screen bg-white font-sans text-neutral-900 antialiased">
  <main class="flex min-h-screen items-center justify-center px-6">
    <div class="flex flex-col items-center gap-4 text-center">
      <svg class="h-6 w-6 animate-spin text-primary" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4z"></path>
      </svg>
      <p class="text-sm text-neutral-500">Signing you in…</p>
    </div>
  </main>

  <script>
    // The SSO callback redirects here with tokens in the URL fragment:
    //   /auth/complete#access_token=…&refresh_token=…&next=/home
    // The fragment is never sent to the server, keeping tokens out of logs.
    (function () {
      const params = new URLSearchParams(location.hash.slice(1));
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');

      // Only allow same-origin relative paths as the redirect target.
      const rawNext = params.get('next') || '/home';
      const next = rawNext.startsWith('/') && !rawNext.startsWith('//') ? rawNext : '/home';

      if (!accessToken) {
        location.replace('/login');
        return;
      }

      try {
        localStorage.setItem('access_token', accessToken);
        if (refreshToken) localStorage.setItem('refresh_token', refreshToken);
      } catch {}

      // Clear the fragment so tokens don't linger in the address bar / history.
      location.replace(next);
    })();
  </script>
</body>
</html>
