{% extends "_app.html" %}
{% set active = 'projects' %}
{% block title %}Projects · callstack{% endblock %}

{% block content %}
<div class="mx-auto w-full max-w-4xl px-4 py-10 sm:px-6">
  <div class="flex items-start justify-between gap-6">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Projects</h1>
      <p class="mt-2 max-w-lg text-sm leading-relaxed text-neutral-500">Group pipelines and test cases by product, team or customer.</p>
    </div>
    <button type="button"
            class="shrink-0 rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white transition hover:bg-primary-hover focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-ring focus-visible:ring-offset-2">
      New project
    </button>
  </div>

  <div class="mt-10 flex flex-col items-center justify-center rounded-xl border border-dashed border-neutral-200 px-6 py-20 text-center">
    <p class="text-sm font-medium text-neutral-800">No projects yet</p>
    <p class="mt-1 text-sm text-neutral-500">Nothing here yet. It'll show up as soon as you create one.</p>
  </div>
</div>
{% endblock %}
